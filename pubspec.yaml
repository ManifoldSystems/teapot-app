name: teapot_app
description: "Teapot — personal mesh on iroh. Android exit node."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  intl: ^0.20.2
  skeletonizer: ^2.1.2
  drift: ^2.30.1
  shared_preferences: ^2.5.4
  gap: ^3.0.1
  flutter_animate: ^4.5.2
  toastification: ^3.0.3
  responsive_builder: ^0.7.1
  keyboard_actions: ^4.2.1
  flutter_launcher_icons: ^0.14.4
  talker: ^5.1.12
  talker_dio_logger: ^5.1.12
  talker_flutter: ^5.1.12
  go_router: ^17.0.1
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  path: ^1.9.1
  workmanager: ^0.9.0+3
  flutter_localizations:
    sdk: flutter
  iroh_flutter: ^1.2.0
  flutter_secure_storage: ^11.2.0
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.3
  flutter_foreground_task: ^11.0.3
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  drift_dev: ^2.30.1
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/launcher/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher/icon_ios_square.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/launcher/splash_logo.png
  android_12:
    image: assets/launcher/icon_foreground_padded_light.png
    icon_background_color: "#ffffff"
